<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>文档1 - wdt</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bundle.css">
</head>
<body>
  <!-- ============ Word 2010 皮肤 ============ -->
  <!-- 标题行：Word图标 + QAT + 居中标题 + 窗口按钮 -->
  <div id="titlebar">
    <div id="app-icon" title="wdt">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <rect x="1" y="1" width="16" height="16" rx="2" fill="#2b579a"/>
        <path d="M4 4h10v10H4z" fill="#fff" opacity="0.12"/>
        <text x="9" y="13.2" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">W</text>
      </svg>
    </div>
    <div id="qat">
      <button class="qat-btn" id="qat-save" title="保存 (Ctrl+S)">
        <svg viewBox="0 0 16 16" width="14" height="14">
          <path d="M2.5 2.5 A1 1 0 0 1 3.5 1.5 h7 l3 3 v9 a1 1 0 0 1 -1 1 h-9 a1 1 0 0 1 -1 -1 z" fill="#2a5ea8" stroke="#1d4885" stroke-width="0.8"/>
          <rect x="4.5" y="2" width="6" height="4.5" rx="0.5" fill="#eef3fa"/>
          <rect x="7.5" y="2.5" width="2" height="3" fill="#2a5ea8"/>
          <rect x="4" y="8.5" width="8" height="5" rx="0.5" fill="#f7fafd" stroke="#90b0d8" stroke-width="0.6"/>
        </svg>
      </button>
      <button class="qat-btn" id="qat-undo" title="撤销 (Ctrl+Z)">
        <svg viewBox="0 0 16 16" width="14" height="14">
          <path d="M6 3.5 L2 7.5 L6 11.5 V8.5 C9 8.5 12.5 9.5 14 13.5 C14 8 10 5.5 6 5.5 Z" fill="#2a66b8"/>
        </svg>
      </button>
      <button class="qat-btn" id="qat-redo" title="重做 (Ctrl+Y)">
        <svg viewBox="0 0 16 16" width="14" height="14">
          <path d="M10 3.5 L14 7.5 L10 11.5 V8.5 C7 8.5 3.5 9.5 2 13.5 C2 8 6 5.5 10 5.5 Z" fill="#2a66b8"/>
        </svg>
      </button>
      <span class="qat-more" title="自定义快速访问工具栏">▾</span>
    </div>
    <div id="title-text">文档1 - wdt</div>
    <div id="win-controls">
      <button class="wc-btn" id="wc-min" title="最小化">─</button>
      <button class="wc-btn" id="wc-max" title="最大化">▢</button>
      <button class="wc-btn wc-close" id="wc-close" title="关闭">✕</button>
    </div>
  </div>

  <!-- 选项卡行：文件（蓝色，最左）+ 其余选项卡 —— Word 2010 布局 -->
  <div id="ribbon">
    <div id="file-tab">文件</div>
    <div id="ribbon-tabs"></div>
    <div id="ribbon-extra">
      <button class="r-extra-btn" id="btn-collapse" title="最小化功能区 (Ctrl+F1)">▲</button>
      <button class="r-extra-btn" id="btn-help" title="wdt 帮助 (F1)">?</button>
    </div>
  </div>
  <div id="ribbon-body"></div>

  <!-- ============ 文件菜单（Backstage：蓝色渐变侧栏，Office 2010 风格） ============ -->
  <div id="backstage" hidden>
    <div id="bs-sidebar">
      <div class="bs-item bs-back" id="bs-back"><svg class="bs-svg" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>返回</div>
      <div class="bs-item" data-bs="start"><svg class="bs-svg" viewBox="0 0 16 16"><path d="M2 8l6-6 6 6h-2v5h-3v-3H7v3H4V8H2z" fill="currentColor"/></svg>开始</div>
      <div class="bs-item" data-bs="info"><svg class="bs-svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="4.4" r="1" fill="currentColor"/></svg>信息</div>
      <div class="bs-item" data-bs="new"><svg class="bs-svg" viewBox="0 0 16 16"><path d="M3 1h7l3 3v11H3z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 6v4M6 8h4" stroke="currentColor" stroke-width="1.5"/></svg>新建</div>
      <div class="bs-item" data-bs="open"><svg class="bs-svg" viewBox="0 0 16 16"><path d="M1 4h5l2 2h7v8H1z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>打开</div>
      <div class="bs-item" data-bs="save"><svg class="bs-svg" viewBox="0 0 16 16"><path d="M1 1h11l3 3v11H1z" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="4" y="9" width="8" height="5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>保存</div>
      <div class="bs-item" data-bs="saveAs"><svg class="bs-svg" viewBox="0 0 16 16"><path d="M1 3h9l2.5 2.5V13H1z" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="9" width="6" height="4" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M13 2l2 2-5.5 5.5-2.5.5.5-2.5z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>另存为</div>
      <div class="bs-item" data-bs="print"><svg class="bs-svg" viewBox="0 0 16 16"><rect x="4" y="1" width="8" height="4" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="5" width="12" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="4" y="9" width="8" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>打印</div>
      <div class="bs-item" data-bs="export"><svg class="bs-svg" viewBox="0 0 16 16"><path d="M8 1v8M5 6l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 11v3h12v-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>导出</div>
      <div class="bs-item" data-bs="options"><svg class="bs-svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v2.2M8 12.3v2.2M1.5 8h2.2M12.3 8h2.2M3.4 3.4l1.6 1.6M11 11l1.6 1.6M12.6 3.4L11 5M5 11l-1.6 1.6" stroke="currentColor" stroke-width="1.3"/></svg>选项</div>
      <div class="bs-item" data-bs="close"><svg class="bs-svg" viewBox="0 0 16 16"><rect x="3" y="1" width="7" height="9" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 12l4-4M8 14l4-4" stroke="currentColor" stroke-width="1.4"/></svg>关闭</div>
    </div>
    <div id="bs-main">
      <div id="bs-title">新建</div>
      <div id="bs-body"></div>
    </div>
  </div>

  <!-- ============ 编辑区（三种模式共用容器） ============ -->
  <div id="editor-wrap">
    <div id="paper">
      <div id="milkdown-host"></div>
      <div id="milkdown-host-h"></div>
      <div id="cm-host"></div>
    </div>
  </div>

  <!-- ============ 状态栏 ============ -->
  <div id="statusbar">
    <span class="st-l" id="st-page">页面: 1/1</span>
    <span class="st-l" id="st-count">字数: 0</span>
    <span class="st-l" id="st-proof" title="校对">
      <svg viewBox="0 0 16 16" width="12" height="12" style="vertical-align:middle;margin-right:2px">
        <path d="M2 3 h5 v10 h-5 z M9 3 h5 v10 h-5 z" fill="#8cb2d8"/>
        <path d="M4 8 l2 2 l4 -4" stroke="#2a66b8" stroke-width="1.6" fill="none"/>
      </svg>
      中文(中国)
    </span>
    <span class="st-l" id="st-ins">插入</span>
    <span class="st-r">
      <span class="st-views">
        <button class="st-vbtn" data-mode="presentation" title="表现模式（富文本视图，输入不解析 Markdown）">🗔</button>
        <button class="st-vbtn" data-mode="hybrid" title="半表现模式（Typora 式，实时渲染）">📖</button>
        <button class="st-vbtn" data-mode="source" title="代码模式（纯 Markdown 源码）">✎</button>
      </span>
      <span class="st-zoom">
        <button class="zbtn" id="zoom-out" title="缩小">−</button>
        <span class="ztrack" id="zoom-track">
          <span class="zcenter-tick"></span>
          <span class="zslider" id="zoom-slider" style="left:38%"></span>
        </span>
        <button class="zbtn" id="zoom-in" title="放大">+</button>
        <span id="st-zoom-pct">100%</span>
      </span>
    </span>
  </div>

  <!-- ============ 表格尺寸选择器（Word 式网格拖选） ============ -->
  <div id="table-picker" hidden>
    <div class="tp-grid"></div>
    <div class="tp-label">2×2 表格</div>
  </div>

  <!-- ============ 复制/粘贴浮动选项卡（Word 2010 式） ============ -->
  <div id="paste-opt" hidden>
    <div id="po-btn" title="粘贴选项 (Ctrl)">
      <svg viewBox="0 0 18 18" width="18" height="18">
        <rect x="4" y="2" width="10" height="14" rx="1" fill="#f7fafd" stroke="#5a7ca6"/>
        <rect x="7" y="1" width="4" height="3" rx="1" fill="#5a7ca6"/>
        <path d="M9 7 L9 12 M6.8 10 L9 12.2 L11.2 10" stroke="#2a7ad4" stroke-width="1.6" fill="none"/>
      </svg>
    </div>
    <div id="po-menu" hidden>
      <div class="po-title">粘贴选项:</div>
      <div class="po-row">
        <div class="po-item" id="po-adv" title="保留源格式 (K)">
          <div class="po-card">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <rect x="5" y="3" width="14" height="18" rx="1.5" fill="#fcfdfe" stroke="#688cb6"/>
              <rect x="9" y="1.5" width="6" height="3" rx="0.8" fill="#d49b28" stroke="#906510" stroke-width="0.7"/>
              <path d="M8 8 h8 M8 12 h5 M8 16 h7" stroke="#3d6ea8" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M14 13 L17 10 L19 12 L16 15 Z" fill="#d2801e"/>
              <path d="M13 14 L14 13 L16 15 L15 16 Z" fill="#444"/>
            </svg>
          </div>
          <span class="po-lbl">保留源格式 (K)</span>
        </div>
        <div class="po-item" id="po-merge" title="合并格式 (M)">
          <div class="po-card">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <rect x="5" y="3" width="14" height="18" rx="1.5" fill="#fcfdfe" stroke="#688cb6"/>
              <rect x="9" y="1.5" width="6" height="3" rx="0.8" fill="#d49b28" stroke="#906510" stroke-width="0.7"/>
              <path d="M8 8 h8 M8 12 h8 M8 16 h6" stroke="#7a97ba" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M12 11 L12 16 M10 14 L12 16.5 L14 14" stroke="#226bc2" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="po-lbl">合并格式 (M)</span>
        </div>
        <div class="po-item" id="po-md" title="只保留文本 (T)">
          <div class="po-card">
            <svg viewBox="0 0 24 24" width="22" height="22">
              <rect x="5" y="3" width="14" height="18" rx="1.5" fill="#fcfdfe" stroke="#688cb6"/>
              <rect x="9" y="1.5" width="6" height="3" rx="0.8" fill="#d49b28" stroke="#906510" stroke-width="0.7"/>
              <text x="12" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f3864">A</text>
            </svg>
          </div>
          <span class="po-lbl">只保留文本 (T)</span>
        </div>
      </div>
      <div class="po-default" id="po-default">设置默认粘贴(A)...</div>
    </div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
